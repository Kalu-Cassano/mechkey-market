{% extends "layouts/base.html" %}
{% block title %}Danh mục{% endblock %}
{% block content %}
<h1 class="h2 mb-4">Quản lý danh mục</h1>
<div class="row g-4"><div class="col-lg-5"><form class="card card-body" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2 class="h5">Thêm danh mục</h2><div class="mb-3"><label class="form-label">Tên</label><input class="form-control" name="name" maxlength="100" required></div><div class="mb-3"><label class="form-label">Mô tả</label><textarea class="form-control" name="description"></textarea></div><button class="btn btn-primary">Thêm</button></form></div>
<div class="col-lg-7"><div class="list-group">{% for category in categories %}<div class="list-group-item"><strong>{{ category.name }}</strong><div class="small text-muted">{{ category.description }}</div></div>{% else %}<div class="alert alert-info">Chưa có danh mục.</div>{% endfor %}</div></div></div>
{% endblock %}
