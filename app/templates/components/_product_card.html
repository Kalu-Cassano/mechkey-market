<div class="col">
    <div class="card product-card h-100 border-0 shadow-sm">
        {% if product.image_filename %}
        <img src="{{ url_for('static', filename='uploads/products/' + product.image_filename) }}" class="card-img-top product-image" alt="{{ product.name }}">
        {% else %}
        <div class="product-placeholder d-flex align-items-center justify-content-center">Không có ảnh</div>
        {% endif %}
        <div class="card-body d-flex flex-column">
            <span class="small text-primary">{{ product.category.name }}</span>
            <h5 class="card-title mt-1">{{ product.name }}</h5>
            <p class="small text-muted mb-2">{{ product.vendor.store_name or product.vendor.full_name }}</p>
            <div class="mt-auto d-flex justify-content-between align-items-center">
                <strong class="text-danger">{{ "{:,.0f}".format(product.price) }} ₫</strong>
                <a class="btn btn-sm btn-outline-primary" href="{{ url_for('main.product_detail', product_id=product.id) }}">Xem</a>
            </div>
        </div>
    </div>
</div>
